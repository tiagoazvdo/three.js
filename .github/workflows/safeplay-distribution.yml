name: SafePlay distribution

on:
  push:
    branches:
      - 'safeplay/**'
    tags:
      - 'safeplay-r*'
  pull_request:
    paths:
      - '.github/workflows/safeplay-distribution.yml'
      - 'src/**'
      - 'test/safeplay/**'
      - 'utils/build/**'
      - 'utils/safeplay/**'
      - 'LICENSE'
      - 'package.json'
      - 'package-lock.json'
      - 'SAFEPLAY.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    name: Reproducible ESM and Worker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Git checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22.17.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint downstream rail
        run: npm run lint-safeplay
      - name: Verify deterministic distribution
        run: npm run test-safeplay-determinism
      - name: Verify manifest
        run: npm run verify-safeplay
      - name: Run Worker and OffscreenCanvas smoke
        run: npm run test-safeplay-worker
      - name: Upload verified distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: safeplay-three-r185-${{ github.sha }}
          path: safeplay-dist/r185
          if-no-files-found: error
